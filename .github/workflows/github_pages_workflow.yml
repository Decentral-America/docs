name: Deploy Documentation

on:
  push:
    branches: [main]
    # Redeploy only when something the published site is built from changed. Edits to
    # README.md, PLAN-docs-expansion.md, AGENTS.md and the like do not change a single
    # published page. workflow_dispatch below still deploys on demand.
    paths:
      - 'docs/**'
      - '.github/workflows/github_pages_workflow.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:

  build_docs_job:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    timeout-minutes: 30

    outputs:
      docroot: ${{ steps.build.outputs.docroot }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.14'
        architecture: 'x64'
        cache: pip
        cache-dependency-path: docs/requirements.txt

    - name: Execute script to build our documentation
      id: build
      run: "docs/buildDocs.sh"
      shell: bash

    - name: Built site root redirects to /en/main/
      env:
        DOCROOT: ${{ steps.build.outputs.docroot }}
      run: |
        grep -q "content=\"0; url='/en/main/'\"" "${DOCROOT}/index.html" || { cat "${DOCROOT}/index.html"; exit 1; }

    - name: Every local asset a page references exists in the built site
      env:
        DOCROOT: ${{ steps.build.outputs.docroot }}
      run: python3 docs/scripts/check_static_refs.py "${DOCROOT}/en/main"

    - name: Built site has only the published languages, with the right switcher and banner
      env:
        DOCROOT: ${{ steps.build.outputs.docroot }}
      run: |
        expected="$(python3 docs/scripts/published_locales.py docs/locales | tr ' ' '\n' | sort)"
        built="$(for dir in "${DOCROOT}"/*/; do basename "${dir}"; done | sort)"
        if [ "${built}" != "${expected}" ]; then
          echo "::error::built languages [$(echo ${built})] differ from en + docs/locales/PUBLISHED [$(echo ${expected})]"
          exit 1
        fi
        # main only: every other version renders its switcher from its own branch's conf.py
        for lang in ${expected}; do
          python3 docs/scripts/check_published_languages.py "${DOCROOT}/${lang}/main" "${lang}"
        done

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
      with:
        path: ${{ steps.build.outputs.docroot }}

  deploy_pages_job:
    needs: build_docs_job
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  verify_live_job:
    # The Pages CDN can serve the previous build for a few minutes; retry for up to 15 minutes.
    needs: deploy_pages_job
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Published root redirects to /en/main/ and the English site is up
      run: |
        for attempt in $(seq 1 30); do
          if curl -fsS https://docs.decentralchain.io/ | grep -q "url='/en/main/'" \
             && [ "$(curl -s -o /dev/null -w '%{http_code}' https://docs.decentralchain.io/en/main/)" = "200" ]; then
            echo "live site OK (attempt ${attempt})"; exit 0
          fi
          sleep 30
        done
        echo "::error::https://docs.decentralchain.io/ does not redirect to /en/main/ after 15 minutes"
        curl -sS https://docs.decentralchain.io/ || true
        exit 1
