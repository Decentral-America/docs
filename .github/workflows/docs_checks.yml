name: Docs Independence Check

# Strict build and link check already run in pr_check_workflow.yml. This
# workflow adds the third-party-reference check from the docs expansion
# plan (PLAN-docs-expansion.md §7), the stub-page check and the sample
# checks, so the two don't duplicate CI minutes.

on:
  # Pull requests only. A push to dev used to run the identical jobs a second time for a commit
  # that had already passed them on its pull request (dev mirrors main). Only content these
  # jobs read triggers them; a change to README.md or a plan file at the repo root cannot
  # change any result here. No branch protection requires these checks, so a path filter
  # cannot leave a required check pending.
  pull_request:
    branches: [main, dev]
    paths:
      - 'docs/**'
      - '.vale.ini'
      - '.vale/**'
      - '.github/workflows/docs_checks.yml'

permissions:
  contents: read

concurrency:
  group: docs-independence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independence_check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    # Pages, tables, samples (.ts, .js, .mjs, .java, .ride), static .html/.js/.css and
    # scripts, plus every decoded base64: literal. Legitimate mentions go in
    # docs/scripts/independence_allowlist.txt, each with a reason.
    - name: No third-party project references
      run: python3 docs/scripts/check_independence.py

    - name: No stub pages (under 60 lines and not in docs/scripts/short_pages_allowlist.txt)
      run: python3 docs/scripts/check_page_length.py

  samples_typecheck:
    # Confirms docs/_samples/*.ts compiles against the pinned, *published*
    # npm versions, that those packages load at runtime on Node.js 24, and
    # that every `npm install` line and SDK-table version in the docs
    # installs and imports. Does not broadcast anything: no network beyond
    # npm, no funded account. See docs/_samples/README.md.
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '24'

    - name: Install sample dependencies
      working-directory: docs/_samples
      run: npm install

    - name: Typecheck samples against published packages
      working-directory: docs/_samples
      run: npm run typecheck

    - name: Samples import at runtime on Node.js 24
      working-directory: docs/_samples
      run: |
        for pkg in $(node -p "Object.keys(require('./package.json').dependencies).join(' ')"); do
          node --input-type=module -e "await import('${pkg}'); console.log('ok ${pkg}')"
        done

    - name: Every documented npm install line installs and imports on Node.js 24
      run: python3 docs/scripts/check_install_snippets.py

    - name: Every version in the SDK package table installs and imports on Node.js 24
      run: python3 docs/scripts/check_sdk_table.py

  java_samples_compile:
    # Compiles docs/_samples/java (the Java SDK page's samples) against the
    # published io.decentralchain:java-sdk release. The 2.0.x jars are built
    # for Java 25, so older JDKs cannot compile against them.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'maven'
        cache-dependency-path: 'docs/_samples/java/pom.xml'

    - name: Compile Java samples
      working-directory: docs/_samples/java
      run: mvn -q compile

  vale:
    # House-vocabulary lint from docs/_terminology.md, operationalised as
    # .vale/styles/DecentralChain/*.yml. Currently just the two rules the
    # independence_check job also enforces (belt-and-suspenders, catches
    # the same thing at authoring time in an editor) plus the Decentralite
    # substitution — extend the style files as the terminology sheet
    # grows, rather than adding ad hoc rules here.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: '3.x'

    - name: Install docutils (Vale's RST linter shells out to rst2html)
      run: python3 -m pip install docutils

    - name: Install Vale
      # The release asset name is versioned (vale_<version>_Linux_64-bit.tar.gz),
      # so it's resolved from the API rather than guessed — a guessed
      # unversioned filename 404s. Tested against v3.23.0.
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        url="$(gh api repos/vale-cli/vale/releases/latest -q '.assets[] | select(.name | test("Linux_64-bit")) | .browser_download_url')"
        curl -sL "$url" | tar -xz -C /usr/local/bin vale

    - name: Lint docs against the DecentralChain style
      run: vale --config .vale.ini docs --glob='!locales/**'
